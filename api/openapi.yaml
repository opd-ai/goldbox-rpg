components:
    responses:
        InvalidRequest:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/RPCError'
            description: Invalid RPC request format or parameters
        ServerError:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/RPCError'
            description: Server error during RPC processing
    schemas:
        AttributeMethod:
            enum:
                - roll
                - pointbuy
                - standard
                - custom
            type: string
        CharacterClass:
            enum:
                - fighter
                - mage
                - cleric
                - thief
                - ranger
                - paladin
            type: string
        Position:
            properties:
                x:
                    description: X coordinate
                    type: integer
                "y":
                    description: Y coordinate
                    type: integer
            required:
                - x
                - "y"
            type: object
        RPCError:
            properties:
                code:
                    description: |
                        Error code:
                        -32700: Parse error
                        -32600: Invalid Request
                        -32601: Method not found
                        -32602: Invalid params
                        -32603: Internal error
                    type: integer
                data:
                    description: Additional error information
                    type: object
                message:
                    type: string
            required:
                - code
                - message
            type: object
        RPCRequest:
            properties:
                id:
                    description: Unique request identifier for matching responses
                    oneOf:
                        - type: string
                        - type: number
                jsonrpc:
                    enum:
                        - "2.0"
                    type: string
                method:
                    description: The RPC method name
                    type: string
                params:
                    description: Method-specific parameters
                    type: object
            required:
                - jsonrpc
                - method
                - params
                - id
            type: object
