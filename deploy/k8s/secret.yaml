apiVersion: v1
kind: Secret
metadata:
  name: goldbox-rpg-secrets
  namespace: goldbox-rpg
  labels:
    app: goldbox-rpg
type: Opaque
stringData:
  # WebSocket allowed origins (comma-separated)
  # Replace with your actual domain(s)
  WEBSOCKET_ALLOWED_ORIGINS: "https://yourdomain.com,https://www.yourdomain.com"
  
  # Add additional secrets here as needed:
  # - Database credentials
  # - API keys
  # - Encryption keys
  # - OAuth credentials
  
  # Example secrets (uncomment and populate as needed):
  # DB_PASSWORD: ""
  # API_KEY: ""
  # ENCRYPTION_KEY: ""
  # OAUTH_CLIENT_SECRET: ""
