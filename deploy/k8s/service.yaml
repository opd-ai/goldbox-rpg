apiVersion: v1
kind: Service
metadata:
  name: goldbox-rpg
  namespace: goldbox-rpg
  labels:
    app: goldbox-rpg
spec:
  type: ClusterIP
  selector:
    app: goldbox-rpg
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
apiVersion: v1
kind: Service
metadata:
  name: goldbox-rpg-loadbalancer
  namespace: goldbox-rpg
  labels:
    app: goldbox-rpg
  annotations:
    # Cloud provider specific annotations
    # AWS example:
    # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    # GCP example:
    # cloud.google.com/load-balancer-type: "Internal"
    # Azure example:
    # service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app: goldbox-rpg
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
