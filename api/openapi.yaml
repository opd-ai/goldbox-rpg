                            success:
                                type: boolean
                        required:
                            - success
                            - session_id
                        type: object
                  type: object
        RPCResponse_move:
            allOf:
                - $ref: '#/components/schemas/RPCResponse'
                - properties:
                    result:
                        properties:
                            position:
                                $ref: '#/components/schemas/Position'
                            success:
                                type: boolean
                        required:
                            - success
                            - position
                        type: object
                  type: object
        RPCResponse_startCombat:
            allOf:
                - $ref: '#/components/schemas/RPCResponse'
                - properties:
                    result:
                        properties:
                            first_turn:
                                description: ID of first participant to act
                                type: string
                            initiative:
                                description: Ordered participant IDs based on initiative
                                items:
                                    type: string
                                type: array
                            success:
                                type: boolean
                        required:
                            - success
                            - initiative
                            - first_turn
                        type: object
                  type: object
        Rectangle:
            properties:
                max_x:
                    type: integer
                max_y:
                    type: integer
                min_x:
                    type: integer
                min_y:
                    type: integer
            required:
                - min_x
                - min_y
                - max_x
                - max_y
            type: object
info:
    contact:
        name: OPD-AI
        url: https://github.com/opd-ai/goldbox-rpg
    description: Comprehensive JSON-RPC 2.0 API for the Gold Box RPG game engine, providing character actions, combat management, quest systems, spell management, spatial queries, and procedural content generation.
    license:
        name: MIT
    title: Gold Box RPG JSON-RPC API
    version: 1.0.0
openapi: 3.0.0
paths:
    /rpc:
        post:
            description: Main endpoint for all JSON-RPC method calls
            requestBody:
                content:
                    application/json:
                        schema:
                            oneOf:
                                - $ref: '#/components/schemas/RPCRequest_move'
                                - $ref: '#/components/schemas/RPCRequest_attack'
                                - $ref: '#/components/schemas/RPCRequest_castSpell'
                                - $ref: '#/components/schemas/RPCRequest_useItem'
                                - $ref: '#/components/schemas/RPCRequest_applyEffect'
                                - $ref: '#/components/schemas/RPCRequest_startCombat'
                                - $ref: '#/components/schemas/RPCRequest_endTurn'
                                - $ref: '#/components/schemas/RPCRequest_getGameState'
                                - $ref: '#/components/schemas/RPCRequest_joinGame'
                                - $ref: '#/components/schemas/RPCRequest_leaveGame'
                                - $ref: '#/components/schemas/RPCRequest_createCharacter'
                                - $ref: '#/components/schemas/RPCRequest_equipItem'
                                - $ref: '#/components/schemas/RPCRequest_unequipItem'
                                - $ref: '#/components/schemas/RPCRequest_getEquipment'
                                - $ref: '#/components/schemas/RPCRequest_startQuest'
                                - $ref: '#/components/schemas/RPCRequest_completeQuest'
                                - $ref: '#/components/schemas/RPCRequest_updateObjective'
                                - $ref: '#/components/schemas/RPCRequest_failQuest'
                                - $ref: '#/components/schemas/RPCRequest_getQuest'
                                - $ref: '#/components/schemas/RPCRequest_getActiveQuests'
                                - $ref: '#/components/schemas/RPCRequest_getCompletedQuests'
                                - $ref: '#/components/schemas/RPCRequest_getQuestLog'
                                - $ref: '#/components/schemas/RPCRequest_getSpell'
                                - $ref: '#/components/schemas/RPCRequest_getSpellsByLevel'
                                - $ref: '#/components/schemas/RPCRequest_getSpellsBySchool'
                                - $ref: '#/components/schemas/RPCRequest_getAllSpells'
                                - $ref: '#/components/schemas/RPCRequest_searchSpells'
                                - $ref: '#/components/schemas/RPCRequest_getObjectsInRange'
                                - $ref: '#/components/schemas/RPCRequest_getObjectsInRadius'
                                - $ref: '#/components/schemas/RPCRequest_getNearestObjects'
                                - $ref: '#/components/schemas/RPCRequest_generateContent'
                                - $ref: '#/components/schemas/RPCRequest_regenerateTerrain'
                                - $ref: '#/components/schemas/RPCRequest_generateItems'
                                - $ref: '#/components/schemas/RPCRequest_generateLevel'
                                - $ref: '#/components/schemas/RPCRequest_generateQuest'
                                - $ref: '#/components/schemas/RPCRequest_getPCGStats'
                                - $ref: '#/components/schemas/RPCRequest_validateContent'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/RPCResponse_move'
                                    - $ref: '#/components/schemas/RPCResponse_attack'
                                    - $ref: '#/components/schemas/RPCResponse_generic'
                    description: Successful RPC response
                "400":
                    $ref: '#/components/responses/InvalidRequest'
                "500":
                    $ref: '#/components/responses/ServerError'
            summary: JSON-RPC 2.0 Endpoint
