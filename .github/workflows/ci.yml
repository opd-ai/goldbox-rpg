name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      
      - name: Download dependencies
        run: go mod download
      
      - name: Verify dependencies
        run: go mod verify
      
      - name: Run tests with race detector
        run: go test ./... -v -race -coverprofile=coverage.out -timeout 10m
      
      - name: Generate coverage report
        run: go tool cover -func=coverage.out
      
      - name: Check test coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Current coverage: ${COVERAGE}%"
          
          # Enforce 60% minimum coverage (current baseline)
          THRESHOLD=60.0
          
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below ${THRESHOLD}% threshold"
            exit 1
          else
            echo "✅ Coverage ${COVERAGE}% meets ${THRESHOLD}% threshold"
          fi
      
      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 30

  e2e:
    name: E2E Integration Tests
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      
      - name: Download dependencies
        run: go mod download
      
      - name: Build server
        run: make build
      
      - name: Run E2E tests
        run: go test ./test/e2e/... -v -timeout 10m
      
      - name: Upload E2E test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-logs
          path: /tmp/goldbox-e2e-*/server.log
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  format:
    name: Format Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      
      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest
      
      - name: Check formatting
        run: |
          if [ -n "$(gofumpt -l -s -extra ./pkg)" ]; then
            echo "❌ Code is not formatted. Run 'make fmt' to fix."
            gofumpt -l -s -extra ./pkg
            exit 1
          else
            echo "✅ Code is properly formatted"
          fi

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      
      - name: Check for dependency updates
        run: go list -m -u all

  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      
      - name: Build server
        run: make build
      
      - name: Verify binary exists
        run: |
          if [ ! -f bin/server ]; then
            echo "❌ Server binary not found"
            exit 1
          fi
          echo "✅ Server binary built successfully"
          ls -lh bin/server

  cli-tools:
    name: CLI Tools Smoke Tests
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      
      - name: Download dependencies
        run: go mod download
      
      - name: Build CLI tools
        run: |
          echo "Building CLI tools..."
          go build -o bin/quest-builder ./cmd/quest-builder
          go build -o bin/map-editor ./cmd/map-editor
          go build -o bin/content-creator ./cmd/content-creator
          go build -o bin/dungeon-demo ./cmd/dungeon-demo
          go build -o bin/validator-demo ./cmd/validator-demo
          go build -o bin/openapi-gen ./cmd/openapi-gen
          echo "✅ All CLI tools built successfully"
          ls -lh bin/
      
      - name: Test quest-builder --help
        run: |
          ./bin/quest-builder --help || true
          echo "✅ quest-builder runs"
      
      - name: Test map-editor --help
        run: |
          ./bin/map-editor --help || true
          echo "✅ map-editor runs"
      
      - name: Test content-creator --help
        run: |
          ./bin/content-creator --help || true
          echo "✅ content-creator runs"
      
      - name: Test dungeon-demo --help
        run: |
          ./bin/dungeon-demo --help || true
          echo "✅ dungeon-demo runs"
      
      - name: Test validator-demo --help
        run: |
          ./bin/validator-demo --help || true
          echo "✅ validator-demo runs"
      
      - name: Test openapi-gen --help
        run: |
          ./bin/openapi-gen --help || true
          echo "✅ openapi-gen runs"

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: goldbox-rpg:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Run Docker container
        run: |
          docker run -d --name goldbox-test -p 8080:8080 goldbox-rpg:test
          sleep 10
      
      - name: Test health endpoint
        run: |
          curl -f http://localhost:8080/health || (
            echo "❌ Health check failed"
            docker logs goldbox-test
            exit 1
          )
          echo "✅ Health check passed"
      
      - name: Test readiness endpoint
        run: |
          curl -f http://localhost:8080/ready || (
            echo "❌ Readiness check failed"
            docker logs goldbox-test
            exit 1
          )
          echo "✅ Readiness check passed"
      
      - name: Stop container
        if: always()
        run: docker stop goldbox-test || true

  openapi:
    name: OpenAPI Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      
      - name: Install OpenAPI tools
        run: |
          cd api
          npm ci
      
      - name: Validate OpenAPI spec
        run: |
          cd api
          npx @redocly/cli lint openapi.yaml
          echo "✅ OpenAPI spec is valid"
      
      - name: Check OpenAPI spec sync
        run: |
          echo "Checking if OpenAPI spec is in sync with code..."
          # Generate a temp spec and compare
          go run ./cmd/openapi-gen > /tmp/generated-openapi.yaml || true
          if [ -f /tmp/generated-openapi.yaml ]; then
            # Compare method counts (allow some flexibility in formatting)
            CURRENT_METHODS=$(grep -c "operationId:" api/openapi.yaml || echo 0)
            GENERATED_METHODS=$(grep -c "operationId:" /tmp/generated-openapi.yaml || echo 0)
            echo "Current spec has $CURRENT_METHODS methods"
            echo "Generated spec would have $GENERATED_METHODS methods"
            if [ "$CURRENT_METHODS" -ne "$GENERATED_METHODS" ]; then
              echo "⚠️  OpenAPI spec may be out of sync. Run 'make openapi-gen' to update."
              # Don't fail CI, just warn
            else
              echo "✅ OpenAPI spec appears in sync"
            fi
          fi

  asset-verification:
    name: Asset Verification
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download assets
        run: make assets-download || make assets-placeholders
      
      - name: Verify asset integrity
        run: make assets-verify
      
      - name: Check asset count
        run: |
          count=$(find web/static/assets/sprites -type f -name "*.png" | wc -l)
          echo "Found $count assets"
          if [ "$count" -lt 500 ]; then
            echo "❌ Expected at least 500 assets, found $count"
            exit 1
          fi
          echo "✅ Asset count is sufficient ($count assets)"
