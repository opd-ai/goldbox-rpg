apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: goldbox-rpg
  namespace: goldbox-rpg
  labels:
    app: goldbox-rpg
spec:
  podSelector:
    matchLabels:
      app: goldbox-rpg
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
  # Allow traffic from within the same namespace (for service mesh)
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8080
  # Allow health checks from kube-system (for load balancers)
  - from:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  # Allow HTTPS for external API calls (if needed)
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 443
  # Allow HTTP for metrics/monitoring (if needed)
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 80
