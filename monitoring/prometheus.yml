global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'development'
    app: 'goldbox-rpg'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Load rules once and periodically evaluate them
# rule_files:
#   - "alerts/*.yml"

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape GoldBox RPG server metrics
  - job_name: 'goldbox-server'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['goldbox-server:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'goldbox-server'
