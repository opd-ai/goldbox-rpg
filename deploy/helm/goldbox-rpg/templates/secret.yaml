apiVersion: v1
kind: Secret
metadata:
  name: {{ include "goldbox-rpg.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "goldbox-rpg.labels" . | nindent 4 }}
type: Opaque
stringData:
  WEBSOCKET_ALLOWED_ORIGINS: {{ .Values.secrets.websocketAllowedOrigins | quote }}
  {{- if .Values.secrets.dbPassword }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.apiKey }}
  API_KEY: {{ .Values.secrets.apiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.encryptionKey }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  {{- end }}
  {{- if .Values.secrets.oauthClientSecret }}
  OAUTH_CLIENT_SECRET: {{ .Values.secrets.oauthClientSecret | quote }}
  {{- end }}
